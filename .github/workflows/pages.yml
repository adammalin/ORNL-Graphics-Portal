name: Validate and deploy Graphics Portal demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate public configuration and brand tokens
        run: npm run check
      - name: Install pilot test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-pilot.txt -r requirements-security.txt
      - name: Test workflow rules, gateways and OAuth authorization
        run: npm test
      - name: Audit runtime dependency advisories
        run: python -m pip_audit -r requirements-pilot.txt
      - name: Scan backend security patterns at medium severity or above
        run: python -m bandit -r backend -ll

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
