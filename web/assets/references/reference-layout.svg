<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc"><title id="title">Synthetic layout reference</title><desc id="desc">A sample poster wireframe with a title, image placeholder and two content columns. Not a real project.</desc><path fill="#ffffff" d="M0 0h960v640H0z"/><path fill="#00662c" d="M0 0h960v18H0z"/><g font-family="Arial,sans-serif" fill="#00454d"><text x="64" y="86" font-size="16">SYNTHETIC REFERENCE · DEMO ONLY</text><text x="64" y="146" font-size="36" font-weight="bold">A clear title goes here</text><text x="64" y="181" font-size="19">Example layout for discussing a design direction.</text></g><path fill="#dbdcdb" d="M64 222h832v194H64z"/><text x="480" y="330" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="#373a36">Image or figure area</text><g fill="#00454d"><path d="M64 458h374v8H64zM64 485h340v6H64zM64 509h354v6H64zM64 533h310v6H64zM520 458h376v8H520zM520 485h320v6H520zM520 509h354v6H520zM520 533h285v6H520z"/></g><text x="64" y="601" font-family="Arial,sans-serif" font-size="15" fill="#373a36">Demonstration artwork only. No actual client content.</text></svg>
